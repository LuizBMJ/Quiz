<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Você realmente se conhece?</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700;800&display=swap');

  :root{
    --bg-1: #fbeef2;
    --bg-2: #f3e3f5;
    --card: #ffffff;
    --ink: #4a2f42;
    --ink-soft: #8a6b7d;
    --pink: #e78ca3;
    --pink-deep: #d1668a;
    --lilac: #b98fd1;
    --gold: #e3b04b;
    --wrong: #c96b7a;
    --shadow: 0 20px 45px -20px rgba(148, 76, 110, 0.35);
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,
  body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
  }

  body{
    font-family:'Nunito', sans-serif;
    color:var(--ink);

    background:
      radial-gradient(circle at 15% 10%, #fff5f8 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #f6e6fb 0%, transparent 50%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));

    min-height:100vh;
    min-height:100dvh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:24px;

    overflow-x:hidden;
  }

  .stage{
    width:100%;
    max-width:480px;
    position:relative;
  }

  .card{
    background:var(--card);
    border-radius:28px;
    padding:44px 32px 36px;

    box-shadow:var(--shadow);

    position:relative;
    overflow:hidden;

    animation:rise .5s ease both;
  }

  .card::before{
    content:"";
    position:absolute;
    top:-60px;
    right:-60px;

    width:160px;
    height:160px;

    background:
      radial-gradient(
        circle,
        rgba(231,140,163,.25),
        transparent 70%
      );

    border-radius:50%;
  }

  @keyframes rise{
    from{
      opacity:0;
      transform:translateY(14px);
    }

    to{
      opacity:1;
      transform:translateY(0);
    }
  }

  .eyebrow{
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:.04em;
    margin-bottom:6px;
  }

  h1{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:30px;
    line-height:1.25;
    margin:0 0 12px;
    color:var(--ink);
  }

  h1 em{
    font-style:italic;
    color:var(--pink-deep);
  }

  p.sub{
    font-size:15px;
    color:var(--ink-soft);
    line-height:1.5;
    margin:0 0 28px;
  }

  .hint{
    font-size:13px;
    color:var(--lilac);
    font-style:italic;
    margin:-14px 0 20px;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:8px;
  }

  .option{
    width:100%;

    text-align:left;

    border:1.5px solid #f0dbe4;
    background:#fffafc;
    color:var(--ink);

    border-radius:16px;

    padding:15px 18px;

    font-family:'Nunito', sans-serif;
    font-size:15.5px;
    font-weight:600;

    cursor:pointer;

    transition:
      border-color .18s ease,
      transform .12s ease,
      background .18s ease;

    touch-action:manipulation;
  }

  .option:hover{
    border-color:var(--pink);
    background:#fff3f6;
    transform:translateY(-1px);
  }

  .option:active{
    transform:translateY(0) scale(.99);
  }

  .option.locked{
    pointer-events:none;
  }

  .option.correct-flash{
    background:#fdf0d8;
    border-color:var(--gold);
  }

  .option.wrong-flash{
    background:#f7dde1;
    border-color:var(--wrong);
    animation:shake .35s ease;
  }

  @keyframes shake{
    0%,100%{
      transform:translateX(0);
    }

    25%{
      transform:translateX(-6px);
    }

    75%{
      transform:translateX(6px);
    }
  }

  .btn-main{
    width:100%;
    margin-top:6px;

    background:
      linear-gradient(
        135deg,
        var(--pink),
        var(--pink-deep)
      );

    color:#fff;

    border:none;
    border-radius:16px;

    padding:16px 20px;

    font-family:'Nunito', sans-serif;
    font-size:16px;
    font-weight:800;

    cursor:pointer;

    box-shadow:
      0 12px 24px -10px rgba(209,102,138,.65);

    transition:
      transform .12s ease,
      box-shadow .12s ease;

    touch-action:manipulation;
  }

  .btn-main:hover{
    transform:translateY(-2px);
  }

  .btn-main:active{
    transform:translateY(0);
  }

  .progress-track{
    height:6px;
    border-radius:999px;
    background:#f2dfe6;

    margin-bottom:26px;

    overflow:hidden;
  }

  .progress-fill{
    height:100%;
    border-radius:999px;

    background:
      linear-gradient(
        90deg,
        var(--pink),
        var(--lilac)
      );

    transition:width .35s ease;
  }

  .step-label{
    font-size:12.5px;
    color:var(--ink-soft);

    font-weight:700;
    letter-spacing:.02em;

    margin-bottom:10px;
  }

  .start-icon{
    font-size:42px;
    margin-bottom:14px;
    display:block;
  }

  .score-big{
    font-family:'Playfair Display', serif;
    font-size:54px;
    color:var(--pink-deep);
    margin:6px 0 2px;
  }

  .score-caption{
    font-size:14px;
    color:var(--ink-soft);
    margin-bottom:22px;
  }

  /* ==============================
     JUMPSCARE
     ============================== */

  .jumpscare-overlay{
    position:fixed;

    top:0;
    left:0;
    right:0;
    bottom:0;

    width:100vw;
    height:100vh;
    height:100dvh;

    background:#000;

    display:none;

    align-items:center;
    justify-content:center;

    z-index:99999;

    text-align:center;

    overflow:hidden;

    padding:0;

    /* evita problemas com notch */
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  .jumpscare-overlay.show{
    display:flex;
  }

  /*
    IMPORTANTE:
    width:100% + height:100% faz a imagem funcionar
    melhor no celular do que max-width/max-height isolados.
  */

  .ghost-slot{
    display:block;

    width:100%;
    height:100%;

    max-width:none;
    max-height:none;

    object-fit:contain;

    object-position:center;

    margin:0;
    padding:0;

    animation:scarepop .28s ease;

    /* ajuda alguns navegadores mobile */
    transform:translateZ(0);
    -webkit-transform:translateZ(0);
  }

  @keyframes scarepop{
    0%{
      transform:scale(1.5);
      opacity:0;
    }

    100%{
      transform:scale(1);
      opacity:1;
    }
  }

  /* ==============================
     FINAL
     ============================== */

  .final-overlay{
    position:fixed;

    top:0;
    left:0;
    right:0;
    bottom:0;

    width:100vw;
    height:100vh;
    height:100dvh;

    background:rgba(20,8,16,.88);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:99998;

    padding:40px 28px;

    text-align:center;
  }

  .final-overlay.show{
    display:flex;
    animation:fadein .25s ease;
  }

  @keyframes fadein{
    from{
      opacity:0;
    }

    to{
      opacity:1;
    }
  }

  .final-text{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:600;

    font-size:clamp(26px, 6vw, 38px);

    color:#ffe3ec;

    line-height:1.4;

    max-width:420px;
  }

  .card.dimmed{
    filter:blur(2px) brightness(.6);
  }

  footer.tiny{
    text-align:center;

    font-size:12.5px;

    color:var(--ink-soft);

    margin-top:18px;

    opacity:.8;
  }

  /* ==============================
     MOBILE
     ============================== */

  @media (max-width:600px){

    body{
      padding:16px;
      align-items:center;
    }

    .card{
      padding:32px 22px 26px;
      border-radius:24px;
    }

    h1{
      font-size:27px;
    }

    .option{
      font-size:15px;
      padding:15px 16px;
    }

    .ghost-slot{
      object-fit:contain;
    }
  }

  @media (max-width:380px){

    body{
      padding:12px;
    }

    .card{
      padding:28px 18px 22px;
    }

    h1{
      font-size:25px;
    }

    .option{
      font-size:14px;
    }
  }

  @media (prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
      animation:none !important;
      transition:none !important;
    }
  }
</style>
</head>

<body>

<div class="stage">

  <div class="card" id="card">
    <!-- conteúdo inserido pelo JavaScript -->
  </div>

  <footer class="tiny" id="footerNote">
    feito por alguém que presta atenção em você.
  </footer>

</div>


<!-- ==============================
     JUMPSCARE
     ============================== -->

<div class="jumpscare-overlay" id="jumpscareOverlay">

  <img
    src="./ghost.gif"
    class="ghost-slot"
    id="ghostSlot"
    alt=""
    draggable="false"
  >

</div>


<!-- ==============================
     FINAL
     ============================== -->

<div class="final-overlay" id="finalOverlay">

  <div class="final-text">
    Eu sou suportável, então não vai ter nenhum prêmio, vacilona.
  </div>

</div>


<!-- ==============================
     ÁUDIO
     ============================== -->

<audio
  id="screamAudio"
  preload="auto"
  playsinline
>
  <source src="./scream.mp3" type="audio/mpeg">
</audio>


<script>

/* ==========================================
   CONFIGURAÇÃO DOS ARQUIVOS
   ========================================== */

const GHOST_IMAGE = "./ghost.gif";
const SCREAM_AUDIO = "./scream.mp3";


/* ==========================================
   DADOS DO QUIZ
   ========================================== */

const questions = [

  {
    step:"01/7",
    title:"Qual é a sua cor?",
    options:[
      "Rosa",
      "Azul",
      "Roxo",
      "Branco"
    ],
    correct:[0],
    mode:"single-correct"
  },

  {
    step:"02/7",
    title:"Escolha uma flor.",
    hint:"dica: existe uma resposta muito óbvia aqui.",
    options:[
      "Lírios do vale",
      "Rosas",
      "Girassol",
      "Cerejeira"
    ],
    correct:[0],
    mode:"single-correct"
  },

  {
    step:"03/7",
    title:"Noite de filme. Qual?",
    note:"(sim, essa pergunta é séria.)",
    options:[
      "Como Perder um Homem em 10 Dias",
      "10 Coisas que Eu Odeio em Você",
      "Diário de uma Paixão",
      "Diário de uma Princesa 2",
      "500 Dias com Ela",
      "A Nova Cinderela"
    ],
    correct:[0,1,2,3,4,5],
    mode:"all-correct"
  },

  {
    step:"04/7",
    title:"Qual série você maratona sem parar?",
    options:[
      "Supernatural",
      "Anne com E"
    ],
    correct:[],
    mode:"all-wrong"
  },

  {
    step:"05/7",
    title:"Escolha um livro pra reler pela centésima vez.",
    options:[
      "Príncipe Cruel (a coleção)",
      "Era uma Vez um Coração Partido",
      "Teoricamente Amor",
      "Entre Sombras e Espinhos"
    ],
    correct:[],
    mode:"all-wrong"
  },

  {
    step:"06/7",
    title:"Você está estressada. E agora?",
    note:"(eu me recuso a aceitar outra.)",
    options:[
      "Ficar sozinha",
      "Comer alguma coisa",
      "Reclamar de tudo",
      "Alguém me fazer rir"
    ],
    correct:[3],
    mode:"jumpscare"
  }

];


const prizeOptions = [
  "Receber carinho",
  "Ouvir sua música favorita",
  "Reclamar comigo",
  "Ganhar um beijo"
];


/* ==========================================
   ESTADO
   ========================================== */

let currentIndex = 0;
let score = 0;


/* ==========================================
   ELEMENTOS
   ========================================== */

const card =
  document.getElementById("card");

const jumpscareOverlay =
  document.getElementById("jumpscareOverlay");

const finalOverlay =
  document.getElementById("finalOverlay");

const screamAudio =
  document.getElementById("screamAudio");

const ghostSlot =
  document.getElementById("ghostSlot");


/* ==========================================
   PRÉ-CARREGAR GIF
   ========================================== */

const ghostImagePreload = new Image();

ghostImagePreload.onload = function(){

  console.log("GIF carregado com sucesso.");

};

ghostImagePreload.onerror = function(){

  console.error(
    "Não foi possível carregar ghost.gif"
  );

};

ghostImagePreload.src = GHOST_IMAGE;


/* ==========================================
   PRÉ-CARREGAR ÁUDIO
   ========================================== */

if(screamAudio){

  screamAudio.load();

}


/* ==========================================
   TOCAR ÁUDIO
   ========================================== */

function playAudio(){

  if(!screamAudio){
    return;
  }

  try{

    screamAudio.pause();

    screamAudio.currentTime = 0;

    /*
      Como esta função é chamada depois do clique
      do usuário, o navegador mobile normalmente
      permite o áudio.
    */

    const promise = screamAudio.play();

    if(promise !== undefined){

      promise
        .then(() => {

          console.log(
            "Áudio do jumpscare iniciado."
          );

        })
        .catch(error => {

          console.warn(
            "O navegador bloqueou o áudio:",
            error
          );

        });

    }

  }catch(error){

    console.error(
      "Erro ao tocar áudio:",
      error
    );

  }

}


/* ==========================================
   PARAR ÁUDIO
   ========================================== */

function stopAudio(){

  if(!screamAudio){
    return;
  }

  try{

    screamAudio.pause();
    screamAudio.currentTime = 0;

  }catch(error){

    console.error(
      "Erro ao parar áudio:",
      error
    );

  }

}


/* ==========================================
   TELA INICIAL
   ========================================== */

function renderStart(){

  card.innerHTML = `

    <span class="start-icon">
      🤍
    </span>

    <h1>
      Você <em>realmente</em><br>
      se conhece?
    </h1>

    <p class="sub">
      um quiz extremamente importante
    </p>

    <button
      class="btn-main"
      id="startBtn"
      type="button"
    >
      Começar →
    </button>

  `;


  document
    .getElementById("startBtn")
    .onclick = () => {

      currentIndex = 0;
      score = 0;

      /*
        Também tentamos preparar o áudio durante
        uma interação real do usuário.
      */

      if(screamAudio){

        screamAudio.load();

      }

      renderQuestion();

    };

}


/* ==========================================
   TELA DE PERGUNTA
   ========================================== */

function renderQuestion(){

  const q =
    questions[currentIndex];

  const progressPct =
    Math.round(
      (currentIndex / questions.length) * 100
    );


  card.innerHTML = `

    <div class="step-label">
      QUIZ • ${q.step}
    </div>

    <div class="progress-track">

      <div
        class="progress-fill"
        style="width:${progressPct}%"
      ></div>

    </div>

    <h1>
      ${q.title}
    </h1>

    ${
      q.note
      ?
      `<p class="hint">${q.note}</p>`
      :
      ""
    }

    ${
      q.hint
      ?
      `<p class="hint">${q.hint}</p>`
      :
      ""
    }

    <div
      class="options"
      id="optionsWrap"
    ></div>

  `;


  const wrap =
    document.getElementById(
      "optionsWrap"
    );


  q.options.forEach(
    (label, idx) => {

      const btn =
        document.createElement("button");

      btn.className = "option";

      btn.type = "button";

      btn.textContent = label;

      btn.onclick = () => {

        handleAnswer(
          idx,
          btn,
          q
        );

      };

      wrap.appendChild(btn);

    }
  );

}


/* ==========================================
   RESPOSTA
   ========================================== */

function handleAnswer(
  idx,
  btnEl,
  q
){

  const allBtns =
    document.querySelectorAll(
      "#optionsWrap .option"
    );


  allBtns.forEach(
    b => b.classList.add("locked")
  );


  const isCorrect =
    q.mode === "all-correct"
      ? true
      : q.mode === "all-wrong"
        ? false
        : q.correct.includes(idx);


  /*
    JUMPSCARE
  */

  if(
    q.mode === "jumpscare" &&
    !isCorrect
  ){

    btnEl.classList.add(
      "wrong-flash"
    );


    /*
      Pequena espera para mostrar
      a resposta errada antes do susto.
    */

    setTimeout(
      () => triggerJumpscare(),
      380
    );

    return;

  }


  /*
    RESPOSTA CERTA
  */

  if(isCorrect){

    btnEl.classList.add(
      "correct-flash"
    );

    score++;

  }

  /*
    RESPOSTA ERRADA
  */

  else{

    btnEl.classList.add(
      "wrong-flash"
    );

  }


  setTimeout(
    () => advance(),
    550
  );

}


/* ==========================================
   JUMPSCARE
   ========================================== */

function triggerJumpscare(){

  /*
    Garantimos que a imagem esteja carregada.
  */

  ghostSlot.src = GHOST_IMAGE;


  /*
    Força o navegador a perceber que o elemento
    está visível antes de iniciar a animação.
  */

  jumpscareOverlay.classList.add(
    "show"
  );


  /*
    IMPORTANTE:
    playAudio() acontece imediatamente depois
    do clique/interação que disparou o susto.
  */

  playAudio();


  /*
    Duração do jumpscare.
  */

  setTimeout(
    () => {

      jumpscareOverlay.classList.remove(
        "show"
      );

      stopAudio();

      /*
        Continua na mesma pergunta.
      */

      renderQuestion();

    },
    3000
  );

}


/* ==========================================
   AVANÇAR
   ========================================== */

function advance(){

  currentIndex++;


  if(
    currentIndex < questions.length
  ){

    renderQuestion();

  }

  else{

    renderResult();

  }

}


/* ==========================================
   RESULTADO
   ========================================== */

function renderResult(){

  card.innerHTML = `

    <div class="step-label">
      RESULTADO
    </div>

    <div class="score-big">
      ${score} / ${questions.length}
    </div>

    <p class="score-caption">
      ${resultCaption(
        score,
        questions.length
      )}
    </p>

    <h1 style="font-size:22px;">
      Mas tem um pequeno problema...
    </h1>

    <p class="sub">
      Esse quiz nunca foi sobre descobrir
      quem você é.<br>
      Eu já sabia. 🤍
    </p>

    <button
      class="btn-main"
      id="continueBtn"
      type="button"
    >
      Continuar →
    </button>

  `;


  document
    .getElementById("continueBtn")
    .onclick = renderPrize;

}


/* ==========================================
   TEXTO DO RESULTADO
   ========================================== */

function resultCaption(
  score,
  total
){

  const pct =
    score / total;


  if(pct >= .8){

    return "quase perfeita. quase.";

  }


  if(pct >= .5){

    return "deu pra ver que você tentou.";

  }


  return "ok, isso foi decepcionante. mas vai por outro motivo além do quiz.";

}


/* ==========================================
   PRÊMIO
   ========================================== */

function renderPrize(){

  card.innerHTML = `

    <div class="step-label">
      QUIZ • FINAL/7
    </div>

    <h1>
      Escolha o seu prêmio.
    </h1>

    <div
      class="options"
      id="prizeWrap"
    ></div>

    <p
      class="hint"
      style="margin-top:14px;"
    >
      qualquer uma das opções é válida.
    </p>

  `;


  const wrap =
    document.getElementById(
      "prizeWrap"
    );


  prizeOptions.forEach(
    label => {

      const btn =
        document.createElement("button");

      btn.className = "option";

      btn.type = "button";

      btn.textContent = label;

      btn.onclick = showFinalTwist;

      wrap.appendChild(btn);

    }
  );

}


/* ==========================================
   FINAL
   ========================================== */

function showFinalTwist(){

  card.classList.add(
    "dimmed"
  );

  finalOverlay.classList.add(
    "show"
  );


  setTimeout(
    () => {

      finalOverlay.classList.remove(
        "show"
      );

      card.classList.remove(
        "dimmed"
      );

      renderStart();

    },
    2800
  );

}


/* ==========================================
   INÍCIO
   ========================================== */

renderStart();

</script>

</body>
</html>
